# Refreshes the listings and the video tours once a day.
#
# Two independent sources: Zillow (listings.json) and the YouTube channel's
# public Atom feed (videos.json). YouTube is not bot-protected and works fine
# from a runner; Zillow is the problem child, so its step is allowed to fail
# without taking the videos down with it -- see below.
#
# Pulls both, regenerates the JSON, and commits the result. If nothing on the profile changed, nothing is committed and the run
# is a no-op. Photos stay hotlinked to Zillow's CDN -- only the listing data is
# stored in this repo.
#
# About the bot check: Zillow fingerprints the request, not just the IP, so a
# plain fetch() gets a 403 from a GitHub runner. fetch-listings.mjs tries
# hardened HTTP first and falls back to Playwright's Chromium, which is why
# this job installs a browser. If Zillow blocks the runner outright even then,
# the script exits non-zero and leaves the committed listings.json untouched,
# so the live site keeps showing the last good data -- a failed run is a
# skipped day, never a broken page.
#
# If failures become routine rather than occasional, the fix is to run the
# refresh from a residential connection instead: on Jeffrey's own machine,
#     0 6 * * *  cd /path/to/site && npm run refresh && git commit -am refresh && git push
# or on a self-hosted runner.

name: Refresh listings and videos

on:
  schedule:
    # 10:00 UTC daily = 6am Eastern (5am during EST). Cron is always UTC.
    - cron: '0 10 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: refresh-listings
  cancel-in-progress: false

permissions:
  contents: write           # needed to push the refreshed data back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not its OS libraries, so make sure
      # those are present either way.
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Allowed to fail: Zillow blocks GitHub's IP ranges (PerimeterX shows the
      # runner a "Press & Hold" wall even through headless Chromium). When it
      # fails the script leaves the committed listings.json untouched, and the
      # video refresh below still runs. Check this step's log if listings look
      # stale. If it fails every day, move the listings refresh to a machine on
      # a residential connection and drop this step.
      - name: Fetch listings from Zillow
        id: listings
        continue-on-error: true
        run: node scripts/fetch-listings.mjs

      - name: Fetch videos from YouTube
        run: node scripts/fetch-videos.mjs

      - name: Note if the listings step was blocked
        if: steps.listings.outcome == 'failure'
        run: echo "::warning::Zillow blocked this runner; listings.json kept its previous contents. Videos still refreshed."

      - name: Show what changed
        run: git --no-pager diff --stat -- listings.json videos.json

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail

          # generatedAt and fetchedVia change on every run, so a diff limited to
          # those is not a real change. Ignore them when deciding whether to commit.
          if git diff --quiet -- listings.json videos.json \
             || [ -z "$(git diff -U0 -- listings.json videos.json \
                        | grep -E '^[+-]' \
                        | grep -vE '^(\+\+\+|---)' \
                        | grep -vE '"(generatedAt|fetchedVia)"')" ]; then
            echo "Nothing new today — leaving the repo alone."
            git checkout -- listings.json videos.json 2>/dev/null || true
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json videos.json
          git commit -m "Refresh listings and videos ($(date -u +%Y-%m-%d))"
          git push
