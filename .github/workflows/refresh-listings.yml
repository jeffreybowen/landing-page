# Refreshes the Current listings / Recently sold sections from Zillow.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THE DAILY SCHEDULE IS DISABLED. This runs only when you click            │
# │ "Run workflow" in the Actions tab.                                       │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Why: Zillow fronts the site with PerimeterX bot protection that fingerprints
# the request rather than just the IP. It blocks GitHub's runner IP ranges even
# through headless Chromium -- the browser is shown a "Press & Hold to confirm
# you are a human" wall instead of the profile. A daily cron here would fail
# every morning and email about it, so the schedule is off rather than noisy.
#
# Refresh listings from a residential connection instead:
#
#     cd /path/to/site && npm run listings && git commit -am listings && git push
#
# See README.md ("Zillow and the bot check") for the options if you want this
# automated again.
#
# TO RE-ENABLE the daily run -- if Zillow's blocking ever eases, or you move
# this to a self-hosted runner on a residential connection -- uncomment the
# three `schedule:` lines below.

name: Refresh Zillow listings (manual)

on:
  # schedule:
  #   # 10:00 UTC daily = 6am Eastern. Cron is always UTC.
  #   - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not its OS libraries.
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Expected to fail from a GitHub runner today; see the header. On failure
      # the script leaves the committed listings.json untouched, so a blocked
      # run costs nothing but the minutes.
      - name: Fetch listings from Zillow
        run: node scripts/fetch-listings.mjs

      - name: Show what changed
        run: git --no-pager diff --stat -- listings.json

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail

          # generatedAt and fetchedVia change on every run, so a diff limited to
          # those is not a real change. Ignore them when deciding to commit.
          if git diff --quiet -- listings.json \
             || [ -z "$(git diff -U0 -- listings.json \
                        | grep -E '^[+-]' \
                        | grep -vE '^(\+\+\+|---)' \
                        | grep -vE '"(generatedAt|fetchedVia)"')" ]; then
            echo "No listing changes — leaving the repo alone."
            git checkout -- listings.json 2>/dev/null || true
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json
          git commit -m "Refresh Zillow listings ($(date -u +%Y-%m-%d))"
          git push
