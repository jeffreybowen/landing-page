# Refreshes the Current listings / Recently sold sections once a day.
#
# Pulls Jeffrey's Zillow profile, regenerates listings.json, and commits the
# result. If nothing on the profile changed, nothing is committed and the run
# is a no-op. Photos stay hotlinked to Zillow's CDN -- only the listing data is
# stored in this repo.
#
# About the bot check: Zillow fingerprints the request, not just the IP, so a
# plain fetch() gets a 403 from a GitHub runner. fetch-listings.mjs tries
# hardened HTTP first and falls back to Playwright's Chromium, which is why
# this job installs a browser. If Zillow blocks the runner outright even then,
# the script exits non-zero and leaves the committed listings.json untouched,
# so the live site keeps showing the last good data -- a failed run is a
# skipped day, never a broken page.
#
# If failures become routine rather than occasional, the fix is to run the
# refresh from a residential connection instead: on Jeffrey's own machine,
#     0 6 * * *  cd /path/to/site && npm run listings && git commit -am listings && git push
# or on a self-hosted runner.

name: Refresh Zillow listings

on:
  schedule:
    # 10:00 UTC daily = 6am Eastern (5am during EST). Cron is always UTC.
    - cron: '0 10 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: refresh-listings
  cancel-in-progress: false

permissions:
  contents: write           # needed to push the refreshed data back

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not its OS libraries, so make sure
      # those are present either way.
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Fetch listings from Zillow
        run: node scripts/fetch-listings.mjs

      - name: Show what changed
        run: git --no-pager diff --stat -- listings.json

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail

          # generatedAt and fetchedVia change on every run, so a diff limited to
          # those is not a real change. Ignore them when deciding whether to commit.
          if git diff --quiet -- listings.json \
             || [ -z "$(git diff -U0 -- listings.json \
                        | grep -E '^[+-]' \
                        | grep -vE '^(\+\+\+|---)' \
                        | grep -vE '"(generatedAt|fetchedVia)"')" ]; then
            echo "No listing changes today — leaving the repo alone."
            git checkout -- listings.json 2>/dev/null || true
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json
          git commit -m "Refresh Zillow listings ($(date -u +%Y-%m-%d))"
          git push
